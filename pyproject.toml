[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensymbolicai-core"
version = "0.7.0"
description = "Build LLM-powered systems as typed, testable Python software — not prompt strings"
readme = "README.md"
license = "MIT"
authors = [
    {name = "OpenSymbolicAI", email = "founder@opensymbolic.ai"}
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
]
keywords = [
    "llm",
    "ai-agents",
    "structured-output",
    "pydantic",
    "prompt-engineering",
    "symbolic-ai",
    "ai-framework",
    "opensymbolicai",
    "type-safe",
    "function-calling",
]
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.2.1",
    "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/OpenSymbolicAI/core-py"
Documentation = "https://opensymbolicai.github.io/core-py"
Repository = "https://github.com/OpenSymbolicAI/core-py"
Issues = "https://github.com/OpenSymbolicAI/core-py/issues"
Changelog = "https://github.com/OpenSymbolicAI/core-py/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["opensymbolicai"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/opensymbolicai"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[dependency-groups]
dev = [
    "build>=1.4.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.2",
    "mypy>=1.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "python-semantic-release>=10.5.3",
    "ruff>=0.9",
    "twine>=6.2.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): {version}"
build_command = "uv run python -m build"
tag_format = "v{version}"

[tool.semantic_release.remote]
type = "github"
name = "origin"

[tool.semantic_release.publish]
upload_to_vcs_release = true
